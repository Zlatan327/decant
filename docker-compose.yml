# ==============================================================================
# docker-compose.yml — Complete 7-Tier Production Architecture for Decant Gateway
#
# Architecture Topology (matches NEAR Legion Blueprint):
#
#   [ Frontend: Web / Mobile ] ──────────────▶ [ CDN: Static Assets ]
#                │
#                ▼
#        [ Load Balancer (Nginx) ]
#                │
#      ┌─────────┼─────────┐
#      ▼         ▼         ▼
#   [Server 1] [Server 2] [Server 3] (Decant Gateway Nodes)
#      │         │         │
#      ├─────────┴─────────┼──────────────────────────┐
#      ▼                                              ▼
#   [ Connection Pooler (PgBouncer) ]         [ Redis Cache ]
#      │                                        - Distributed Rate Limiting
#      ▼                                        - Replay Nonce Cache
#   [ Database (PostgreSQL) ]
# ==============================================================================

version: "3.9"

services:
  # ── Tier 1: Frontend CDN & Load Balancer ──────────────────────────────────
  load-balancer:
    image: nginx:alpine
    container_name: decant-load-balancer
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - dashboard-dist:/usr/share/nginx/html:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
    networks:
      - decant-net

  frontend-builder:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: decant-frontend-cdn
    volumes:
      - dashboard-dist:/usr/share/nginx/html
    networks:
      - decant-net

  # ── Tier 2: Horizontally Scaled Backend Cluster (Server 1, 2, 3) ─────────
  gateway-1:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: decant-gateway-server-1
    environment:
      - NODE_ENV=production
      - NODE_ID=server-1
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:decant_secret@pgbouncer:6432/decant
      - DECANT_ADMIN_KEY=${DECANT_ADMIN_KEY:-5936c9888d1fd329b49f1d0b34c3a4b6803bf9b0aec1e99008d82ee8d28c4bcc}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - decant-net

  gateway-2:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: decant-gateway-server-2
    environment:
      - NODE_ENV=production
      - NODE_ID=server-2
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:decant_secret@pgbouncer:6432/decant
      - DECANT_ADMIN_KEY=${DECANT_ADMIN_KEY:-5936c9888d1fd329b49f1d0b34c3a4b6803bf9b0aec1e99008d82ee8d28c4bcc}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - decant-net

  gateway-3:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: decant-gateway-server-3
    environment:
      - NODE_ENV=production
      - NODE_ID=server-3
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://postgres:decant_secret@pgbouncer:6432/decant
      - DECANT_ADMIN_KEY=${DECANT_ADMIN_KEY:-5936c9888d1fd329b49f1d0b34c3a4b6803bf9b0aec1e99008d82ee8d28c4bcc}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - decant-net

  # ── Tier 3: Distributed State & Cache (Redis) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: decant-redis-cache
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - decant-net

  # ── Tier 4: Connection Pooler (PgBouncer) ─────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: decant-pgbouncer-pooler
    ports:
      - "6432:6432"
    volumes:
      - ./deploy/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./deploy/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - decant-net

  # ── Tier 5: Relational ACID Database (PostgreSQL) ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: decant-postgres-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=decant_secret
      - POSTGRES_DB=decant
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - decant-net

volumes:
  dashboard-dist:
  redis-data:
  pg-data:

networks:
  decant-net:
    driver: bridge
