services:
  # ── Tier 1: Frontend CDN & Load Balancer ──────────────────────────────────
  load-balancer:
    image: nginx:alpine
    container_name: decant-load-balancer
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - dashboard-dist:/usr/share/nginx/html:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
    networks:
      - decant-net

  frontend-builder:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: decant-frontend-cdn
    volumes:
      - dashboard-dist:/usr/share/nginx/html
    networks:
      - decant-net

  # ── Tier 2: Horizontally Scaled Backend Cluster (Server 1, 2, 3) ─────────
  gateway-1:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: decant-gateway-server-1
    environment:
      - NODE_ENV=production
      - NODE_ID=server-1
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DATABASE_PATH=/app/data/decant.db
      - DECANT_ADMIN_KEY=${DECANT_ADMIN_KEY:?Set DECANT_ADMIN_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-}
      - UPSTREAM_MODEL=${UPSTREAM_MODEL:-}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - LOAD_BALANCER_ACTIVE=true
      - GEMINI_MODEL=${GEMINI_MODEL:-}
    volumes:
      - gateway-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - decant-net

  gateway-2:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: decant-gateway-server-2
    environment:
      - NODE_ENV=production
      - NODE_ID=server-2
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DATABASE_PATH=/app/data/decant.db
      - DECANT_ADMIN_KEY=${DECANT_ADMIN_KEY:?Set DECANT_ADMIN_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-}
      - UPSTREAM_MODEL=${UPSTREAM_MODEL:-}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - LOAD_BALANCER_ACTIVE=true
      - GEMINI_MODEL=${GEMINI_MODEL:-}
    volumes:
      - gateway-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - decant-net

  gateway-3:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: decant-gateway-server-3
    environment:
      - NODE_ENV=production
      - NODE_ID=server-3
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DATABASE_PATH=/app/data/decant.db
      - DECANT_ADMIN_KEY=${DECANT_ADMIN_KEY:?Set DECANT_ADMIN_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - UPSTREAM_BASE_URL=${UPSTREAM_BASE_URL:-}
      - UPSTREAM_MODEL=${UPSTREAM_MODEL:-}
      - UPSTREAM_API_KEY=${UPSTREAM_API_KEY:-}
      - LOAD_BALANCER_ACTIVE=true
      - GEMINI_MODEL=${GEMINI_MODEL:-}
    volumes:
      - gateway-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - decant-net

  # ── Tier 3: Distributed State & Cache (Redis) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: decant-redis-cache
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - decant-net

volumes:
  dashboard-dist:
  gateway-data:
  redis-data:

networks:
  decant-net:
    driver: bridge
