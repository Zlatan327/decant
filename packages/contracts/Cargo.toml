[package]
name = "decant-contracts"
version = "0.1.0"
edition = "2021"
authors = ["Decant Contributors"]
description = "NEAR smart contracts — ledger for intents, escrowed quotas, and reputations"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.29.1"

[profile.release]
codegen-units = 1
opt-level = "z"
overflow-checks = true
lto = true
debug = false
panic = "abort"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
