;; ==============================================================================
;; deploy/pgbouncer/pgbouncer.ini — PgBouncer Connection Pooler for Decant
;;
;; Configured for transaction pooling mode:
;;   - Pool mode = transaction ensures connections return to pool immediately after COMMIT
;;   - Max connections tuned for multi-node gateway cluster
;; ==============================================================================

[databases]
decant = host=postgres port=5432 dbname=decant auth_user=decant

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 50
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1
