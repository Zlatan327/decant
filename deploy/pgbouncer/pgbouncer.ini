[databases]
decant = host=postgres port=5432 dbname=decant auth_user=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

; Transaction pooling preserves atomic balance reservations without connection leaks
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 50
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
