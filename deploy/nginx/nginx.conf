# ==============================================================================
# nginx.conf — High-Availability Load Balancer & Static CDN for Decant Gateway
#
# Implements:
#   1. Top-tier Load Balancer routing requests across Server 1, Server 2, Server 3
#   2. Low-latency edge caching for Vite React Dashboard static assets (static dashboard assets)
#   3. Zero-buffer streaming reverse proxy for Server-Sent Events (SSE) AI inference
# ==============================================================================

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" $request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Gateway Backend Server Cluster (Server 1, Server 2, Server 3) ────────
    upstream decant_gateway_cluster {
        least_conn; # Distribute connections based on active in-flight requests
        server gateway-1:8080 max_fails=3 fail_timeout=10s;
        server gateway-2:8080 max_fails=3 fail_timeout=10s;
        server gateway-3:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Global Load Balancer & CORS Headers ──
        add_header X-Load-Balancer "decant-nginx-lb" always;

        # ── 1. SSE Real-Time AI Streaming Reverse Proxy (/v1/chat/completions) ──
        # CRITICAL FOR DECANT: SSE tokens must NOT be buffered in the proxy!
        location /v1/chat/completions {
            proxy_pass http://decant_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable proxy buffering for instant real-time token delivery
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Extended timeouts for long reasoning generation
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── 2. General Gateway API Routes (/v1/ and /health) ────────────────────
        location ~ ^/(v1/|health|get|post) {
            proxy_pass http://decant_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # ── 3. Static CDN Layer (Vite Dashboard Frontend) ───────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Caching strategy for static assets
            location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
    }
}
